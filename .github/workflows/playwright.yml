name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:3000
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install automation dependencies
        run: npm ci

      - name: Clone GAD app
        run: git clone https://github.com/jaktestowac/gad-gui-api-demo.git ../gad-gui-api-demo

      - name: Install GAD dependencies
        working-directory: ../gad-gui-api-demo
        run: npm ci

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium
        timeout-minutes: 10

      - name: Install Playwright Chromium
        run: DEBUG=pw:install npx playwright install chromium
        timeout-minutes: 10

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
